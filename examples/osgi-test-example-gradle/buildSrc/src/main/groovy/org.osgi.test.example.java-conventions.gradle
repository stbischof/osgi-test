plugins {
	id("biz.aQute.bnd.builder")
	id("maven-publish")
	id("dev.hargrave.addmavendescriptor")
}

repositories {
	mavenCentral()
}

dependencies {
	def configurationName = pluginManager.hasPlugin("java-library") ? "api" : "compileOnly"
	add(configurationName, "org.osgi:osgi.annotation:8.1.0")
}

group = "org.osgi.test.example"
version = "0.1.0-SNAPSHOT"

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
	withJavadocJar()
	withSourcesJar()
}

publishing {
	publications {
		// main publication
		maven(MavenPublication) {
			from(components.java)
			pom {
				name.set(artifactId)
				description.set(project.provider { project.description })
			}
		}
		// Configure pom metadata
		withType(MavenPublication) { publication ->
			pom {
				url.set("https://eclipse-osgi-technology.github.io/osgi-test/")
				organization {
					name.set("OSGi Working Group")
					url.set("https://www.osgi.org")
				}
				licenses {
					license {
						name.set("Apache-2.0")
						url.set("https://opensource.org/licenses/Apache-2.0")
						distribution.set("repo")
						comments.set("This program and the accompanying materials are made available under the terms of the Apache License, Version 2.0.")
					}
				}
				scm {
					url.set("https://github.com/eclipse-osgi-technology/osgi-test")
					connection.set("scm:git:https://github.com/eclipse-osgi-technology/osgi-test.git")
					developerConnection.set("scm:git:git@github.com:eclipse-osgi-technology/osgi-test.git")
				}
				developers {
					developer {
						id.set("bjhargrave")
						name.set("BJ Hargrave")
						email.set("bj@hargrave.dev")
						url.set("https://github.com/bjhargrave")
						roles.set(["developer"])
						timezone.set("America/New_York")
					}
					developer {
						id.set("stbischof")
						name.set("Stefan Bischof")
						email.set("stbischof@bipolis.org")
						url.set("https://github.com/stbischof")
						roles.set(["developer"])
					}
					developer {
						id.set("timothyjward")
						name.set("Tim Ward")
						email.set("timothyjward@apache.org")
						url.set("https://github.com/timothyjward")
						roles.set(["developer"])
					}
					developer {
						id.set("juergen-albert")
						name.set("Jürgen Albert")
						email.set("j.albert@data-in-motion.biz")
						url.set("https://github.com/juergen-albert")
						roles.set(["developer"])
					}
				}
			}
		}
	}
}

// Disable gradle module metadata
tasks.withType(GenerateModuleMetadata).configureEach {
	enabled = false
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

// Reproducible javadoc
tasks.withType(Javadoc).configureEach {
	options {
		noTimestamp = true
	}
}

tasks.named(JavaPlugin.JAR_TASK_NAME) {
	// Common Bnd configuration
	bundle {
		bnd("""
Bundle-Description: ${project.description}
Bundle-DocURL: https://eclipse-osgi-technology.github.io/osgi-test/
Bundle-License: "Apache-2.0";link="https://opensource.org/licenses/Apache-2.0";description="Apache License, Version 2.0"
Bundle-Name: ${project.group}:${project.name}
Bundle-Vendor: OSGi Working Group
-noextraheaders: true
-noimportjava: true
""")
	}
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	testLogging {
		setExceptionFormat("full")
		info {
			events("STANDARD_OUT", "STANDARD_ERROR", "STARTED", "FAILED", "PASSED", "SKIPPED")
		}
	}
}
